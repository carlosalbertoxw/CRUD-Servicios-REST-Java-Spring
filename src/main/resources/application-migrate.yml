# Perfil 'migrate': ejecuta las migraciones de esquema (Flyway) con un usuario
# con privilegios de DDL y termina. Es el "paso de despliegue" de migraciones,
# separado del proceso que sirve trafico (que corre con minimo privilegio).
#
#   java -jar notes-api.jar --spring.profiles.active=migrate
#
spring:
  # No arranca el servidor web: aplica migraciones y el proceso termina.
  main:
    web-application-type: none
  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:jdbc:mysql://localhost:3306/notes}
    user: ${FLYWAY_DB_USER:notes_user}
    password: ${FLYWAY_DB_PASSWORD:notes_password}
    baseline-on-migrate: true
    locations: classpath:db/migration
