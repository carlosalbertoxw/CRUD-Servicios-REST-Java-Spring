# Perfil 'dev': desarrollo local. Credenciales del MySQL de docker-compose.yml
# (sobreescribibles con DB_URL/DB_USER/DB_PASSWORD), no fuerza HTTPS (se sirve
# por HTTP plano) y el DevDataSeeder crea la API key de desarrollo y notas de
# ejemplo.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/notes}
    username: ${DB_USER:notes_app}
    password: ${DB_PASSWORD:notes_app_password}

app:
  security:
    https-enforced: false
