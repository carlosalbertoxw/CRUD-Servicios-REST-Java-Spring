spring:
  application:
    name: notes-api

  # La aplicacion que SIRVE trafico se conecta con minimo privilegio (solo DML) y
  # NO gestiona el esquema: las migraciones las aplica la imagen oficial de
  # Flyway como paso aparte (servicio "migrations" de docker-compose.yml), con un
  # usuario con DDL. Sin valores por defecto: si falta DB_URL la app no arranca;
  # los valores de desarrollo viven en el perfil 'dev'.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Con varias replicas, cuida que replicas * pool < max_connections de MySQL (151 por defecto).
      maximum-pool-size: 20

  # Hilos virtuales (Java 21+): cada peticion bloqueante (JDBC) usa un hilo
  # virtual en lugar de ocupar uno del pool de Tomcat.
  threads:
    virtual:
      enabled: true

  # Errores en formato RFC 7807 (ProblemDetail), sin filtrar detalles internos.
  mvc:
    problemdetails:
      enabled: true

server:
  # Detras de un reverse proxy que termina TLS. La estrategia 'native' usa el
  # RemoteIpValve de Tomcat, que SOLO acepta X-Forwarded-* desde proxies
  # confiables (por defecto rangos privados). Ajusta la lista con la propiedad
  # server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: native

# Endurecimiento para produccion. Se desactiva en el perfil 'dev' (ver
# application-dev.yml) y en las pruebas. Con https-enforced=true la app redirige
# HTTP -> HTTPS (308) y emite HSTS; asume TLS terminado en el reverse proxy.
app:
  security:
    https-enforced: true
  # Tamano maximo del cuerpo de la peticion (las notas se limitan a 100.000
  # caracteres; no hay razon para aceptar cuerpos mayores a ~1 MB).
  max-request-body-bytes: 1048576

# Rate limiting por IP (ventana fija). Los health checks no consumen cuota.
rate-limiting:
  permit-limit: 100
  window-seconds: 60

# TTL del cache en memoria de API keys validadas.
authentication:
  key-cache-seconds: 60

# Health checks: /actuator/health/liveness (proceso vivo) y
# /actuator/health/readiness (incluye la BD alcanzable). Actuator solo expone
# 'health' por web y sin detalles: es su comportamiento por defecto.
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

---
# Fuera de desarrollo y pruebas, logs estructurados en JSON (formato ECS).
spring:
  config:
    activate:
      on-profile: "!dev & !test"
logging:
  structured:
    format:
      console: ecs
