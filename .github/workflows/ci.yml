name: CI

on:
  push:
    branches: [master, "upgrade/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Las pruebas de integracion levantan MySQL con Testcontainers
      # (Docker viene preinstalado en los runners de ubuntu-latest).
      - name: Compilar y probar
        run: mvn -B verify

  dependency-audit:
    runs-on: ubuntu-latest
    # La primera descarga completa de la base NVD tarda >30 min incluso con
    # NVD_API_KEY; con la cache guardada, las siguientes ejecuciones bajan a
    # unos minutos. El timeout evita cuelgues de horas si el NVD falla.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Cachea la base de datos de vulnerabilidades (NVD) entre ejecuciones para
      # que la auditoria sea rapida y fiable.
      # Restore/save separados con if:always(): aunque la descarga del NVD
      # falle a medias (su API es inestable), el avance se guarda y el
      # siguiente run REANUDA en vez de empezar de cero. La clave incluye el
      # run_id porque una clave fija con hit exacto nunca re-guardaria la
      # base actualizada; restore-keys recupera la mas reciente.
      - name: Restaurar base NVD
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      # Bloquea el build si hay dependencias con CVEs (CVSS >= 7). Requiere el
      # secreto NVD_API_KEY para que la descarga de la base NVD sea fiable
      # (https://nvd.nist.gov/developers/request-an-api-key).
      - name: Auditar dependencias vulnerables (OWASP dependency-check)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity verify -DskipTests

      - name: Guardar base NVD (incluso si la auditoria fallo)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
