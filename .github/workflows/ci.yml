name: CI

on:
  push:
    branches: [master, "upgrade/**"]
  pull_request:

# El token de GitHub solo necesita leer el codigo.
permissions:
  contents: read

# Un push nuevo sobre la misma rama deja obsoleto al run anterior: cancelarlo
# libera runners de inmediato. En master no se cancela: cada commit integrado
# conserva su propio resultado de CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # OSV-Scanner resuelve el arbol de dependencias del pom.xml (directas y
  # transitivas) y lo cruza con la base OSV: tarda segundos y no necesita API key.
  dependency-audit:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Escanear dependencias vulnerables (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  # Suite rapida (Surefire, clases *Test): logica pura, sin Spring ni Docker,
  # mas la verificacion de formato. Da feedback en menos de un minuto.
  unit-tests:
    name: Formato y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verificar formato (Spotless)
        run: mvn -B spotless:check

      - name: Ejecutar pruebas unitarias
        run: mvn -B test

      # Solo cuando hay algo que investigar: en verde nadie abre estos reportes.
      - name: Publicar reportes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-unitarias
          path: target/surefire-reports/
          if-no-files-found: ignore

  # Suite lenta (Failsafe, clases *IT): levanta MySQL con Testcontainers
  # (Docker viene preinstalado en los runners de ubuntu-latest) y ejercita la
  # API completa. -DskipUnitTests evita repetir la suite del job anterior.
  #
  # Depende de unit-tests: si la logica basica ya esta rota, no tiene sentido
  # gastar varios minutos y un contenedor MySQL en confirmarlo.
  integration-tests:
    name: Pruebas de integracion
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Ejecutar pruebas de integracion
        run: mvn -B verify -DskipUnitTests=true

      - name: Publicar reportes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-integracion
          path: target/failsafe-reports/
          if-no-files-found: ignore
