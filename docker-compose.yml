services:
  mysql:
    image: mysql:8.4
    # Convencion del proyecto: todas las fechas se guardan en UTC.
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: notes
      MYSQL_USER: notes_user          # usuario con DDL, reservado a las migraciones (Flyway)
      MYSQL_PASSWORD: notes_password
    # 3307 en el host para poder correr a la vez los proyectos C# (3306) y PHP (3308).
    ports:
      - "3307:3306"
    volumes:
      - notes-mysql-data:/var/lib/mysql
      - ./db/init-users.sql:/docker-entrypoint-initdb.d/init-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Aplica el esquema con la imagen oficial de Flyway (misma version mayor que
  # usan las pruebas) y el usuario notes_user (DDL), y termina. El proceso que
  # sirve trafico nunca tiene credenciales con DDL ni Flyway en su classpath.
  migrations:
    image: flyway/flyway:12
    command: >-
      -url=jdbc:mysql://mysql:3306/notes?allowPublicKeyRetrieval=true
      -user=notes_user
      -password=notes_password
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # La API se conecta como notes_app (solo DML) y arranca cuando las migraciones
  # terminaron correctamente. El perfil 'dev' siembra la key de desarrollo y notas
  # de ejemplo, y sirve por HTTP plano (sin forzar HTTPS).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # 8082 en el host: el proyecto C# usa 8080 y el PHP 8081.
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: "jdbc:mysql://mysql:3306/notes"
      DB_USER: notes_app
      DB_PASSWORD: notes_app_password
    depends_on:
      mysql:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  notes-mysql-data:
